<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance-DeepSeek API 测试控制台</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --code-bg: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            color: white;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .config-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            background: var(--card);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .config-bar label {
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .config-bar input {
            flex: 1;
            min-width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 Finance-DeepSeek API 测试控制台</h1>
            <p>交互式测试所有 REST 端点 — 点击按钮即可发送请求</p>
        </header>
        
        <div class="config-bar">
            <label>API Base URL:</label>
            <input type="text" id="baseUrl" value="http://localhost:8000" />
        </div>
        
        <div id="test-results"></div>
    </div>
    
    <script>
        const baseUrl = document.getElementById('baseUrl').value;
        
        async function testHealth() {
            try {
                const resp = await fetch(`${baseUrl}/health`);
                const data = await resp.json();
                return { name: 'Health Check', status: resp.status, data };
            } catch (e) {
                return { name: 'Health Check', status: 0, error: e.message };
            }
        }
        
        // Add more test functions here
    </script>
</body>
</html>
