# Finance-DeepSeek 项目配置

project:
  name: "Finance-DeepSeek"
  seed: 42

model:
  base_model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  local_path: "./models/base/deepseek-ai/DeepSeek-R1-Distill-Qwen-1___5B"
  max_seq_length: 2048

rag:
  embedding_model: "BAAI/bge-large-zh-v1.5"
  fallback_embedding_model: "yiyanghkust/finbert-tone"
  top_k: 10
  rerank_top_k: 5
  use_reranker: true
  reranker:
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    max_length: 512
    batch_size: 16
  index_path: "./data/index/faiss.index"
  metadata_path: "./data/index/metadata.json"
  corpus_dir: "./data/corpus"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./models/adapters/finance-qlora"
  train_data_path: "./data/sft/train_with_think.jsonl"
  eval_data_path: "./data/sft/eval_with_think.jsonl"
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_strategy: "epoch"
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  group_by_length: true
  report_to: "none"

hardware:
  training_peak_memory_gb: 12

api:
  host: "0.0.0.0"
  port: 8000

reasoning:
  min_steps: 2
  numeric_tolerance: 0.01